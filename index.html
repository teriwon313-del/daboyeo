<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다보여 대시보드</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17171a">
<style>
  :root {
    --bg: #101013;
    --card: #1c1c21;
    --line: #2c2c32;
    --text: #ececf0;
    --dim: #9a9aa3;
    --accent1: #ff2d55;
    --accent2: #962fbf;
    --red: rgba(200, 16, 16, 0.9);
    --green: rgba(14, 122, 48, 0.9);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px;
    padding-bottom: 40px;
  }
  header {
    padding: 10px 12px 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header h1 span {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .quota { font-size: 12px; color: var(--dim); text-align: right; }
  main { padding: 0 12px; max-width: 1840px; margin: 0 auto; }

  .box {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 9px;
    margin-bottom: 8px;
  }
  .row { display: flex; gap: 6px; }
  input, select, button {
    font-family: inherit;
    font-size: 13.5px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: #101014;
    color: var(--text);
    padding: 8px 9px;
  }
  #go { flex: 2; }
  #filters.folded { display: none; }
  .summary {
    font-size: 12px;
    color: var(--dim);
    padding: 6px 2px 0;
    display: none;
  }
  .summary.on { display: block; }
  .mt6 { margin-top: 6px; }
  input { width: 100%; }
  input::placeholder { color: #63636c; }
  select { flex: 1; }
  button { cursor: pointer; }
  .btn-main {
    background: linear-gradient(135deg, var(--accent1), var(--accent2));
    border: none;
    font-weight: 700;
    white-space: nowrap;
  }
  .btn-ghost { background: #26262c; border: none; font-weight: 600; white-space: nowrap; }
  .hint { font-size: 12px; color: var(--dim); margin-top: 8px; line-height: 1.6; }
  .hint a { color: var(--accent1); }
  #status { font-size: 13px; color: var(--dim); margin: 4px 2px 10px; min-height: 18px; }
  #status.err { color: #ff6b6b; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  /* 화면이 넓어질수록 열을 늘려 좌우 여백을 없앤다 */
  @media (min-width: 520px)  { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 680px)  { .grid { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 840px)  { .grid { grid-template-columns: repeat(5, 1fr); } }
  @media (min-width: 1080px) { .grid { grid-template-columns: repeat(6, 1fr); } }
  @media (min-width: 1340px) { .grid { grid-template-columns: repeat(7, 1fr); } }
  @media (min-width: 1620px) { .grid { grid-template-columns: repeat(8, 1fr); } }

  /* 데스크톱: 입력·필터는 읽기 좋은 폭으로 모아두고, 카드 그리드만 꽉 채운다 */
  @media (min-width: 1000px) {
    .box, #status { max-width: 1100px; margin-left: auto; margin-right: auto; }
    #filters { display: flex; align-items: center; gap: 6px; }
    #filters .row { margin-top: 0; flex: 1; }
    #filters .chk { margin-top: 0; }
  }
  .card {
    background: var(--card);
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: var(--text);
    display: block;
    border: 1px solid var(--line);
    position: relative;
  }
  .card .hidebtn {
    position: absolute;
    top: 5px;
    right: 5px;
    background: rgba(0, 0, 0, 0.65);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 11px;
    padding: 4px 7px;
    cursor: pointer;
    opacity: 0.85;
  }
  /* 마우스 환경에서는 카드에 올렸을 때만 보이게 (터치에선 항상 표시) */
  @media (hover: hover) {
    .card .hidebtn { opacity: 0; }
    .card:hover .hidebtn { opacity: 1; }
  }
  .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
  .card .t {
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1.4;
    padding: 7px 9px 2px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 37px;
  }
  .card .ch { font-size: 11px; color: var(--dim); padding: 0 9px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .stats {
    font-size: 10.5px;
    line-height: 1.55;
    padding: 5px 8px;
    background: rgba(0, 0, 0, 0.45);
    /* 열이 많아 카드가 좁아져도 잘리지 않고 줄바꿈되게 한다 */
    white-space: normal;
    word-break: keep-all;
  }
  .card .stats.red { background: var(--red); }
  .card .stats.green { background: var(--green); }
  #settings { display: none; }
  #settings.open { display: block; }
  .mt8 { margin-top: 8px; }

  .chips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    margin-top: 8px;
    padding-bottom: 2px;
    -webkit-overflow-scrolling: touch;
  }
  .chips:empty { display: none; }
  .chip {
    display: flex;
    align-items: center;
    gap: 7px;
    background: #26262c;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  .chip:active { background: #333340; }
  .chip .x {
    color: var(--dim);
    font-size: 12px;
    padding: 2px;
  }
  .chk {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--dim);
    white-space: nowrap;
    padding: 0 4px;
  }
  .chk input { width: 17px; height: 17px; accent-color: var(--accent1); }
  .card .rg {
    font-size: 10.5px;
    color: var(--dim);
    padding: 0 9px 6px;
    white-space: nowrap;
  }
</style>
</head>
<body>
<header>
  <h1><span>다보여</span> 대시보드</h1>
  <div class="quota">오늘 사용 추정<br><b id="quotaUsed">0</b> / 10,000</div>
  <button class="btn-ghost" id="gear" title="API 키 설정">⚙️</button>
</header>

<main>
  <div class="box" id="settings">
    <div class="row">
      <input type="password" id="apiKey" placeholder="YouTube API 키 (AIza...)">
      <button class="btn-main" id="saveKey">저장</button>
    </div>
    <div class="hint">
      키는 이 기기 브라우저에만 저장됩니다.
      발급: <a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank">API 켜기</a> →
      <a href="https://console.cloud.google.com/apis/credentials" target="_blank">키 만들기</a>
    </div>
  </div>

  <div class="box">
    <div class="row">
      <input id="query" placeholder="채널 @핸들 · 채널 URL · 검색어" autocapitalize="off">
      <button class="btn-ghost" id="favBtn" title="현재 입력을 즐겨찾기로 저장">★ 저장</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="row mt6">
      <button class="btn-main" id="go">조회</button>
      <button class="btn-ghost" id="copy">URL 복사</button>
      <button class="btn-ghost" id="fold" title="필터 접기/펴기">필터 ▾</button>
    </div>
    <div class="summary" id="summary"></div>
    <div id="filters">
      <div class="row mt6">
        <select id="period">
          <option value="all">전체 기간</option>
          <option value="7">최근 7일</option>
          <option value="14">최근 14일</option>
          <option value="30" selected>최근 30일</option>
          <option value="90">최근 90일</option>
          <option value="180">최근 180일</option>
          <option value="365">최근 1년</option>
          <option value="730">최근 2년</option>
          <option value="1095">최근 3년</option>
          <option value="365~730">1년~2년 전</option>
          <option value="365~1095">1년~3년 전</option>
          <option value="730~1095">2년~3년 전</option>
        </select>
        <select id="sort">
          <option value="views">조회수순</option>
          <option value="er">ER순</option>
          <option value="likes">좋아요순</option>
          <option value="comments">댓글순</option>
          <option value="date" selected>최신순</option>
        </select>
      </div>
      <div class="row mt6">
        <select id="region">
          <option value="all">모든 국가</option>
          <option value="high_cpm">고CPM 국가</option>
          <option value="kr_us">한국 + 미국</option>
          <option value="no_asia">아시아 제외</option>
          <option value="kr">한국만</option>
          <option value="us">미국만</option>
        </select>
        <select id="maxCount">
          <option value="50">50개</option>
          <option value="100" selected>100개</option>
          <option value="150">150개</option>
          <option value="250">250개</option>
          <option value="400">400개</option>
        </select>
        <select id="minViews">
          <option value="0">조회수 전체</option>
          <option value="100000">10만+</option>
          <option value="500000">50만+</option>
          <option value="1000000">100만+</option>
          <option value="3000000">300만+</option>
          <option value="10000000">1000만+</option>
        </select>
      </div>
      <label class="chk mt6"><input type="checkbox" id="incUnknown" checked> 국가 미상 포함</label>
    </div>
    <div class="chips" id="blockedBar"></div>
  </div>

  <div id="status"></div>
  <div class="grid" id="grid"></div>
</main>

<script src="../key.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const API = "https://www.googleapis.com/youtube/v3/";
let rows = [];

// ----- 할당량 추정 (오늘 자정 리셋, 기기 로컬 기준) -----
function quotaState() {
  const today = new Date().toISOString().slice(0, 10);
  let q = {};
  try { q = JSON.parse(localStorage.getItem("yt_quota") || "{}"); } catch (e) {}
  if (q.day !== today) q = { day: today, used: 0 };
  return q;
}
function addQuota(n) {
  const q = quotaState();
  q.used += n;
  localStorage.setItem("yt_quota", JSON.stringify(q));
  $("quotaUsed").textContent = q.used.toLocaleString();
}
$("quotaUsed").textContent = quotaState().used.toLocaleString();

// ----- API 키 -----
// localStorage에 없으면 ../key.js에 붙여넣어 둔 공용 키를 쓴다 (초기화 방지)
const savedKey = localStorage.getItem("yt_api_key") || self.DABOYEO_KEY || "";
$("apiKey").value = savedKey;
if (!savedKey) $("settings").classList.add("open");
$("gear").addEventListener("click", () => $("settings").classList.toggle("open"));
$("saveKey").addEventListener("click", () => {
  localStorage.setItem("yt_api_key", $("apiKey").value.trim());
  $("settings").classList.remove("open");
  setStatus("API 키 저장됨 ✓");
});

function setStatus(msg, isErr) {
  const s = $("status");
  s.textContent = msg;
  s.className = isErr ? "err" : "";
}

async function api(path, params, cost) {
  const key = localStorage.getItem("yt_api_key") || self.DABOYEO_KEY || "";
  if (!key) throw new Error("API 키를 먼저 저장하세요 (우측 상단 ⚙️)");
  const qs = new URLSearchParams({ ...params, key });
  const r = await fetch(API + path + "?" + qs);
  addQuota(cost);
  const data = await r.json();
  if (!r.ok) {
    throw new Error((data.error && data.error.message) || "API 오류 " + r.status);
  }
  return data;
}

// ----- 조회 -----
function parseChannel(input) {
  const t = input.trim();
  let m = t.match(/@([\w.\-가-힣]+)/);
  if (m) return { forHandle: "@" + m[1] };
  m = t.match(/channel\/(UC[\w-]{22})/);
  if (m) return { id: m[1] };
  if (/^UC[\w-]{22}$/.test(t)) return { id: t };
  return null;
}

async function fetchVideosByIds(ids) {
  const out = [];
  for (let i = 0; i < ids.length; i += 50) {
    const data = await api("videos", {
      part: "statistics,snippet",
      id: ids.slice(i, i + 50).join(","),
      maxResults: 50,
    }, 1);
    for (const item of data.items || []) {
      const st = item.statistics || {};
      const sn = item.snippet || {};
      out.push({
        id: item.id,
        title: sn.title || "",
        channel: sn.channelTitle || "",
        channelId: sn.channelId || "",
        lang: (sn.defaultAudioLanguage || sn.defaultLanguage || "")
          .toLowerCase().split("-")[0],
        date: (sn.publishedAt || "").slice(0, 10),
        views: st.viewCount != null ? Number(st.viewCount) : 0,
        likes: st.likeCount != null ? Number(st.likeCount) : null,
        comments: st.commentCount != null ? Number(st.commentCount) : null,
      });
    }
  }
  return out;
}

// fromTs: 이보다 오래된 영상에서 중단 · toTs: 이보다 최신인 영상은 건너뜀 (구간 필터)
async function loadChannel(chParam, maxCount, fromTs, toTs) {
  const ch = await api("channels", {
    part: "contentDetails,snippet", ...chParam,
  }, 1);
  if (!ch.items || !ch.items.length) throw new Error("채널을 찾을 수 없습니다");
  const uploads = ch.items[0].contentDetails.relatedPlaylists.uploads;
  const chName = ch.items[0].snippet.title;
  setStatus(`"${chName}" 영상 목록 불러오는 중…`);

  const ids = [];
  let pageToken = "";
  while (ids.length < maxCount) {
    const pl = await api("playlistItems", {
      part: "contentDetails",
      playlistId: uploads,
      maxResults: 50,
      ...(pageToken ? { pageToken } : {}),
    }, 1);
    let stop = false;
    for (const it of pl.items || []) {
      const ts = new Date(it.contentDetails.videoPublishedAt || 0).getTime();
      if (fromTs && ts < fromTs) { stop = true; break; }
      if (toTs && ts > toTs) continue;
      ids.push(it.contentDetails.videoId);
      if (ids.length >= maxCount) break;
    }
    pageToken = pl.nextPageToken;
    if (stop || !pageToken) break;
  }
  if (!ids.length) throw new Error("해당 기간에 올라온 영상이 없습니다");
  return fetchVideosByIds(ids);
}

// 국가 필터에 맞춰 검색 자체를 해당 지역 기준으로 돌린다.
// (같은 100단위 비용으로 원하는 국가의 영상이 훨씬 많이 잡힌다)
const SEARCH_HINT = {
  us:       { regionCode: "US", relevanceLanguage: "en" },
  high_cpm: { regionCode: "US", relevanceLanguage: "en" },
  no_asia:  { regionCode: "US", relevanceLanguage: "en" },
  kr:       { regionCode: "KR", relevanceLanguage: "ko" },
};

async function loadSearch(q, maxCount, fromTs, toTs) {
  const seen = new Set(); // 페이지 간 중복이 있어도 요청한 개수를 채운다
  let pageToken = "";
  const hint = SEARCH_HINT[$("region").value] || {};
  while (seen.size < maxCount) {
    const params = {
      part: "id", q, type: "video", maxResults: 50, ...hint,
      ...(pageToken ? { pageToken } : {}),
    };
    // 조회수순으로 볼 때는 검색 결과 자체를 조회수순으로 받는다
    // (관련도순 상위 N개만 받아 필터링하면 인기영상을 놓친다)
    if ($("sort").value === "views") params.order = "viewCount";
    if (fromTs) params.publishedAfter = new Date(fromTs).toISOString();
    if (toTs) params.publishedBefore = new Date(toTs).toISOString();
    const data = await api("search", params, 100);
    for (const it of data.items || []) {
      if (it.id && it.id.videoId) seen.add(it.id.videoId);
      if (seen.size >= maxCount) break;
    }
    pageToken = data.nextPageToken;
    if (!pageToken) break;
  }
  if (!seen.size) throw new Error("검색 결과가 없습니다");
  return fetchVideosByIds([...seen]);
}

// ----- 국가 판정 -----
// 유튜브 API는 "영상의 국가"를 주지 않는다. 채널의 등록 국가(snippet.country)를
// 1순위로 쓰고, 비어 있으면 영상 언어로 추정하며, 둘 다 없으면 '미상'으로 둔다.
const ASIA = new Set(["KR","JP","CN","TW","HK","MO","TH","VN","ID","MY","SG","PH",
  "IN","PK","BD","LK","NP","MM","KH","LA","BN","MN","KZ","UZ","KG","TJ","TM","AF",
  "BT","MV","TL","AE","SA","IL","TR","IR","IQ","JO","LB","KW","QA","BH","OM","YE",
  "SY","PS","AM","AZ","GE","CY"]);
// 아시아권 언어 (채널 국가가 없을 때의 보조 신호)
const ASIAN_LANGS = new Set(["ko","ja","zh","th","vi","id","ms","tl","fil","hi",
  "bn","ta","te","mr","gu","kn","ml","pa","ur","ne","si","my","km","lo","mn","ar",
  "he","fa","tr","kk","uz"]);
const LANG_TO_COUNTRY = { ko: "KR", ja: "JP", zh: "CN", th: "TH", vi: "VN",
  id: "ID", ms: "MY", hi: "IN", tr: "TR", ar: "SA", he: "IL", fa: "IR" };
const FLAG = { KR: "🇰🇷", US: "🇺🇸", JP: "🇯🇵", CN: "🇨🇳", TW: "🇹🇼", GB: "🇬🇧",
  IN: "🇮🇳", ID: "🇮🇩", VN: "🇻🇳", TH: "🇹🇭", PH: "🇵🇭", BR: "🇧🇷", DE: "🇩🇪",
  FR: "🇫🇷", ES: "🇪🇸", CA: "🇨🇦", AU: "🇦🇺", RU: "🇷🇺", MX: "🇲🇽",
  CH: "🇨🇭", NO: "🇳🇴", NZ: "🇳🇿", DK: "🇩🇰", SE: "🇸🇪", NL: "🇳🇱", IE: "🇮🇪" };

// 국가별 평균 CPM(USD) — 고CPM 국가 필터 및 카드 표시에 사용
const CPM = { US: 14.67, AU: 13.30, CH: 12.98, NO: 11.21, NZ: 10.21,
  CA: 9.93, DE: 9.79, DK: 9.13, GB: 8.91 };
const HIGH_CPM = new Set(Object.keys(CPM));

// 채널 국가 캐시 (할당량 절약 — 기기에 영구 저장)
let chCache = {};
try { chCache = JSON.parse(localStorage.getItem("yt_ch_country") || "{}"); } catch (e) {}

async function attachCountries(list) {
  const need = [...new Set(list.map((r) => r.channelId).filter(
    (id) => id && chCache[id] === undefined))];
  for (let i = 0; i < need.length; i += 50) {
    const data = await api("channels", {
      part: "snippet", id: need.slice(i, i + 50).join(","), maxResults: 50,
    }, 1);
    for (const it of data.items || []) {
      chCache[it.id] = (it.snippet && it.snippet.country) || "";
    }
    // 응답에 없던 채널도 재조회하지 않도록 빈 값으로 기록
    for (const id of need.slice(i, i + 50)) {
      if (chCache[id] === undefined) chCache[id] = "";
    }
  }
  localStorage.setItem("yt_ch_country", JSON.stringify(chCache));

  for (const r of list) {
    const c = chCache[r.channelId] || "";
    if (c) {
      r.country = c;
      r.guess = false;
    } else if (r.lang && LANG_TO_COUNTRY[r.lang]) {
      r.country = LANG_TO_COUNTRY[r.lang];
      r.guess = true;
    } else if (r.lang === "en") {
      r.country = "EN";   // 영어권 — 특정 국가로 확정 불가
      r.guess = true;
    } else {
      r.country = "";     // 미상
      r.guess = false;
    }
  }
}

// 아시아 중 한국·일본·싱가포르만 허용, 나머지 아시아는 어떤 필터에서도 표시하지 않음
const ASIA_ALLOW = new Set(["KR", "JP", "SG"]);
const BLOCK_LANGS = new Set([...ASIAN_LANGS].filter((l) => l !== "ko" && l !== "ja"));

function isBlocked(r) {
  const c = (r.country || "").toUpperCase();
  if (c === "EN") return false;
  if (c) return ASIA.has(c) && !ASIA_ALLOW.has(c);
  return r.lang ? BLOCK_LANGS.has(r.lang) : false;
}

function isAsian(r) {
  if (r.country === "EN") return false;      // 영어권은 비아시아로 취급
  if (r.country) return ASIA.has(r.country);
  return r.lang ? ASIAN_LANGS.has(r.lang) : null; // null = 판정 불가
}

function passRegion(r) {
  const mode = $("region").value;
  if (mode === "all") return true;
  const unknown = !r.country;
  if (unknown) return $("incUnknown").checked;

  if (mode === "high_cpm")
    return HIGH_CPM.has(r.country) || r.country === "EN"; // 영어권은 대부분 고CPM
  if (mode === "kr") return r.country === "KR";
  if (mode === "us") return r.country === "US" || r.country === "EN";
  if (mode === "kr_us")
    return r.country === "KR" || r.country === "US" || r.country === "EN";
  if (mode === "no_asia") {
    const a = isAsian(r);
    return a === null ? $("incUnknown").checked : !a;
  }
  return true;
}

function regionLabel(r) {
  if (!r.country) return "🌐 국가 미상";
  if (r.country === "EN") return "🌐 영어권(추정)";
  const flag = FLAG[r.country] || "🌐";
  const cpm = CPM[r.country] ? " · CPM $" + CPM[r.country].toFixed(2) : "";
  return flag + " " + r.country + (r.guess ? "(추정)" : "") + cpm;
}

// ----- 숨긴 채널 (기기 영구 저장: {channelId: 채널명}) -----
let blockedCh = {};
try { blockedCh = JSON.parse(localStorage.getItem("yt_blocked_ch") || "{}"); } catch (e) {}

function saveBlockedCh() {
  localStorage.setItem("yt_blocked_ch", JSON.stringify(blockedCh));
  renderBlockedBar();
}

function renderBlockedBar() {
  const bar = $("blockedBar");
  bar.textContent = "";
  for (const [id, name] of Object.entries(blockedCh)) {
    const chip = document.createElement("div");
    chip.className = "chip";
    chip.title = "숨김 해제";
    const label = document.createElement("span");
    label.textContent = "🚫 " + name;
    const x = document.createElement("span");
    x.className = "x";
    x.textContent = "✕";
    chip.appendChild(label);
    chip.appendChild(x);
    chip.addEventListener("click", () => {
      delete blockedCh[id];
      saveBlockedCh();
      if (rows.length) render();
    });
    bar.appendChild(chip);
  }
}

// ----- 렌더링 -----
function fmt(n) {
  if (n == null || isNaN(n)) return "-";
  if (n >= 1e8) return (n / 1e8).toFixed(1).replace(/\.0$/, "") + "억";
  if (n >= 1e4) return (n / 1e4).toFixed(1).replace(/\.0$/, "") + "만";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "천";
  return String(n);
}
const erOf = (r) => (r.views > 0 && r.likes != null ? (r.likes / r.views) * 100 : null);

function visibleRows() {
  const sortKey = $("sort").value;
  const keyFn = {
    views: (r) => r.views, likes: (r) => r.likes ?? -1,
    comments: (r) => r.comments ?? -1, er: (r) => erOf(r) ?? -1,
    date: (r) => new Date(r.date || 0).getTime(),
  }[sortKey];
  const minV = Number($("minViews").value) || 0;
  const list = rows.filter((r) =>
    !isBlocked(r) && passRegion(r) && !blockedCh[r.channelId] && r.views >= minV);
  list.sort((a, b) => keyFn(b) - keyFn(a));
  return list;
}

function render() {
  const list = visibleRows();
  const blocked = rows.filter(isBlocked).length;
  const regionPass = rows.filter((r) => !isBlocked(r) && passRegion(r));
  const chHidden = regionPass.filter((r) => blockedCh[r.channelId]).length;
  const filtered = rows.length - blocked - regionPass.length;
  const underView = regionPass.length - chHidden - list.length;
  setStatus(
    `${list.length}개 표시` +
    (rows.length ? ` (수집 ${rows.length}개` : "") +
    (filtered > 0 ? ` · 국가필터 ${filtered}` : "") +
    (underView > 0 ? ` · 조회수미달 ${underView}` : "") +
    (chHidden > 0 ? ` · 숨긴채널 ${chHidden}` : "") +
    (blocked > 0 ? ` · 제외국가 ${blocked}` : "") +
    (rows.length ? ")" : "")
  );

  const grid = $("grid");
  grid.textContent = "";
  for (const r of list) {
    const er = erOf(r);
    const a = document.createElement("a");
    a.className = "card";
    a.href = "https://www.youtube.com/watch?v=" + r.id;
    a.target = "_blank";
    let cls = "";
    if (r.views >= 10000000) cls = " red";
    else if (r.comments != null && r.comments >= 300) cls = " green";
    a.innerHTML =
      `<img loading="lazy" src="https://i.ytimg.com/vi/${r.id}/mqdefault.jpg">` +
      `<div class="t"></div><div class="ch"></div><div class="rg"></div>` +
      `<div class="stats${cls}">▶ ${fmt(r.views)} · 👍 ${fmt(r.likes)} · 💬 ${fmt(r.comments)}<br>` +
      `📅 ${r.date} · ER ${er == null ? "-" : er.toFixed(2) + "%"}</div>`;
    a.querySelector(".t").textContent = r.title;
    a.querySelector(".ch").textContent = r.channel;
    a.querySelector(".rg").textContent = regionLabel(r);
    if (r.channelId) {
      const hb = document.createElement("button");
      hb.className = "hidebtn";
      hb.textContent = "🚫";
      hb.title = `"${r.channel}" 채널 숨기기`;
      hb.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        blockedCh[r.channelId] = r.channel || r.channelId;
        saveBlockedCh();
        render();
      });
      a.appendChild(hb);
    }
    grid.appendChild(a);
  }
}

// ----- 즐겨찾기 칩 -----
function getFavs() {
  try {
    const v = JSON.parse(localStorage.getItem("yt_favs"));
    if (Array.isArray(v)) return v;
  } catch (e) {}
  return null;
}
function setFavs(f) {
  localStorage.setItem("yt_favs", JSON.stringify(f));
  renderChips();
}
if (getFavs() === null) setFavs(["쇼츠", "Shorts"]); // 최초 기본 칩

// 기본 즐겨찾기 시드 — 기기마다 한 번만 기존 칩에 병합한다.
// (시드 버전을 기록해 두므로, 병합 후 지운 칩이 되살아나지 않는다)
const FAV_SEED = ["cutevideos", "Funny", "Family", "Comedy", "Love", "Reels",
  "Couple reels", "Fathers day", "Couplegoals", "funny animals",
  "oddly satisfying", "try not to laugh"];
if (localStorage.getItem("yt_favs_seed") !== "1") {
  const cur = getFavs() || [];
  setFavs([...new Set([...cur, ...FAV_SEED])]);
  localStorage.setItem("yt_favs_seed", "1");
}

function renderChips() {
  const favs = getFavs() || [];
  const box = $("chips");
  box.textContent = "";
  for (const fav of favs) {
    const chip = document.createElement("div");
    chip.className = "chip";
    const label = document.createElement("span");
    label.textContent = fav;
    const x = document.createElement("span");
    x.className = "x";
    x.textContent = "✕";
    x.title = "삭제";
    x.addEventListener("click", (e) => {
      e.stopPropagation();
      setFavs(favs.filter((f) => f !== fav));
    });
    chip.appendChild(label);
    chip.appendChild(x);
    chip.addEventListener("click", () => {
      $("query").value = fav;
      run();
    });
    box.appendChild(chip);
  }
}
renderChips();

$("favBtn").addEventListener("click", () => {
  const q = $("query").value.trim();
  if (!q) { setStatus("저장할 검색어나 채널을 먼저 입력하세요", true); return; }
  const favs = getFavs() || [];
  if (favs.includes(q)) { setStatus("이미 저장된 항목입니다", true); return; }
  setFavs([...favs, q]);
  setStatus(`"${q}" 즐겨찾기에 고정됨 ★`);
});

// ----- 설정·결과 기억 -----
const SETTING_IDS = ["period", "sort", "region", "maxCount", "minViews"];

function updateSummary() {
  const folded = $("filters").classList.contains("folded");
  $("fold").textContent = folded ? "필터 ▸" : "필터 ▾";
  const sum = $("summary");
  sum.classList.toggle("on", folded);
  if (folded) {
    const txt = (id) => $(id).options[$(id).selectedIndex].textContent;
    sum.textContent =
      [txt("period"), txt("sort"), txt("region"), txt("maxCount"),
       txt("minViews")].join(" · ");
  }
}

function saveSettings() {
  const s = {
    query: $("query").value,
    incUnknown: $("incUnknown").checked,
    folded: $("filters").classList.contains("folded"),
  };
  SETTING_IDS.forEach((id) => (s[id] = $(id).value));
  localStorage.setItem("yt_settings", JSON.stringify(s));
  updateSummary();
}

function restoreSettings() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem("yt_settings") || "{}"); } catch (e) {}
  SETTING_IDS.forEach((id) => {
    const ok = s[id] != null && [...$(id).options].some((o) => o.value === s[id]);
    if (ok) $(id).value = s[id];
  });
  if (typeof s.incUnknown === "boolean") $("incUnknown").checked = s.incUnknown;
  if (s.query) $("query").value = s.query;
  if (s.folded) $("filters").classList.add("folded");
  updateSummary();
}

// 마지막 조회 결과를 저장해 두고 다음 접속 때 그대로 복원한다 (할당량 소모 없음)
function saveResults() {
  try {
    localStorage.setItem("yt_last", JSON.stringify({
      ts: Date.now(), rows: rows.slice(0, 150),
    }));
  } catch (e) { /* 용량 초과 등은 무시 */ }
}

function restoreResults() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem("yt_last") || "null"); } catch (e) {}
  if (!d || !Array.isArray(d.rows) || !d.rows.length) return;
  rows = d.rows;
  render();
  const mins = Math.max(0, Math.round((Date.now() - d.ts) / 60000));
  const ago = mins < 60 ? mins + "분 전" : Math.round(mins / 60) + "시간 전";
  setStatus(`마지막 조회 결과 (${ago}) · ${visibleRows().length}개 표시 — 새로 받으려면 조회`);
}

$("fold").addEventListener("click", () => {
  $("filters").classList.toggle("folded");
  saveSettings();
});

// ----- 이벤트 -----
$("go").addEventListener("click", run);
$("query").addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });
// 설정을 바꾸면 즉시 저장하고, 화면에 영향 있는 항목은 다시 그린다
["sort", "region", "incUnknown", "minViews"].forEach((id) =>
  $(id).addEventListener("change", () => {
    saveSettings();
    if (rows.length) render();
  })
);
["period", "maxCount"].forEach((id) =>
  $(id).addEventListener("change", saveSettings)
);
$("query").addEventListener("change", saveSettings);

async function run() {
  const q = $("query").value.trim();
  if (!q) { setStatus("채널이나 검색어를 입력하세요", true); return; }
  // period: "30" = 최근 30일, "365~1095" = 1년~3년 전 구간
  const period = $("period").value;
  let fromTs = null, toTs = null;
  if (period !== "all") {
    const [recent, older] = period.split("~").map(Number);
    fromTs = Date.now() - (older || recent) * 86400000;
    if (older) toTs = Date.now() - recent * 86400000;
  }
  const maxCount = Number($("maxCount").value);
  $("go").disabled = true;
  setStatus("불러오는 중…");
  try {
    const ch = parseChannel(q);
    rows = ch ? await loadChannel(ch, maxCount, fromTs, toTs)
              : await loadSearch(q, maxCount, fromTs, toTs);
    rows = rows.filter((r) => {
      const ts = new Date(r.date).getTime();
      return (!fromTs || ts >= fromTs) && (!toTs || ts <= toTs);
    });
    setStatus("국가 정보 확인 중…");
    try {
      await attachCountries(rows);
    } catch (e) {
      // 국가 조회에 실패해도 목록은 보여준다 (모두 '미상' 처리)
      rows.forEach((r) => { if (r.country === undefined) r.country = ""; });
    }
    render();
    saveSettings();
    saveResults();
  } catch (e) {
    setStatus(String(e.message || e), true);
  }
  $("go").disabled = false;
}

$("copy").addEventListener("click", async () => {
  if (!rows.length) { setStatus("먼저 조회하세요", true); return; }
  const list = visibleRows();
  if (!list.length) { setStatus("표시된 영상이 없습니다", true); return; }
  const text = list.map((r) => "https://www.youtube.com/watch?v=" + r.id).join("\n");
  try {
    await navigator.clipboard.writeText(text);
    setStatus(`URL ${list.length}개 복사됨 ✓ — 다받아에 붙여넣으면 일괄 다운로드`);
  } catch (e) {
    setStatus("복사 실패 — 다시 시도해주세요", true);
  }
});

// 모든 선언이 끝난 뒤 마지막 상태를 복원한다 (선언 전에 부르면 TDZ 오류)
restoreSettings();
renderBlockedBar();
restoreResults();
</script>
